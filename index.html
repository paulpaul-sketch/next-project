<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>NEXT PROJECT</title>
<style>
  :root {
    --bg: #111318; --header: #181b22; --hover: #1e222b; --input: #1c1f27; --line: #262a34;
    --text: #e8eaee; --sub: #78808e; --ph: #969eac; --stay: #5c6370;
    --accent: #5eead4; --habit: #f87171; --accent-dim: #2d6962; --danger: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
    font-size: 15px; display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: var(--text); background: none; border: 0; outline: none; width: 100%; }
  input::placeholder { color: var(--ph); }

  header {
    display: flex; align-items: center; gap: 8px; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
    background: var(--header); flex: none;
  }
  header .dot { width: 8px; height: 8px; background: var(--accent); transition: opacity .3s; }
  header .dot.busy { animation: pulse 1s infinite; }
  header .dot.err { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }
  header h1 { margin: 0; font: 600 14px "Segoe UI", -apple-system, sans-serif; letter-spacing: .02em; }
  header .count { color: var(--accent); font: 600 14px "Segoe UI", -apple-system, sans-serif; }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }

  /* 目標 */
  .goal { margin: 14px 14px 8px; background: var(--header); border-left: 3px solid var(--accent); padding: 10px 14px 12px; }
  .goal label { display: block; color: var(--accent); font-size: 12px; margin-bottom: 4px; }
  .goal input { font-size: 18px; font-weight: 600; }
  .goal.habit { margin-top: 0; border-left-color: var(--habit); }
  .goal.habit label { color: var(--habit); }
  .goal.habit input { font-size: 16px; }

  /* プロジェクト */
  .projects { padding: 6px 14px; display: flex; flex-direction: column; gap: 8px; }
  .card {
    display: flex; align-items: center; min-height: 48px; border-radius: 10px; background: var(--pc); color: #fff;
    font-weight: 600; overflow: hidden;
  }
  .card .name { flex: 1; text-align: left; padding: 12px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .more { width: 44px; align-self: stretch; font-size: 18px; opacity: .8; }
  .card:active { filter: brightness(1.15); }
  .card.stay { background: var(--hover); color: var(--stay); box-shadow: inset 4px 0 0 color-mix(in srgb, var(--pc) 45%, var(--hover)); }
  .card .cstay { flex: none; font-size: 12px; font-weight: 400; color: var(--sub); border: 1px solid var(--line); border-radius: 13px; padding: 3px 10px; }
  .empty { color: var(--sub); text-align: center; padding: 48px 16px; }

  /* 詳細 */
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 4px; border-bottom: 1px solid var(--line); margin: 0 12px; }
  .bar .back { width: 40px; height: 44px; font-size: 28px; color: var(--sub); line-height: 1; }
  .bar .pdot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); flex: none; }
  .bar .pname { flex: 1; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .tcount { color: var(--sub); font-size: 12px; white-space: nowrap; }
  .bar .more { width: 40px; height: 44px; color: var(--sub); font-size: 18px; }

  .task { display: flex; align-items: center; min-height: 50px; margin: 0 12px; border-bottom: 1px solid var(--line); position: relative; }
  .task.today { background: var(--pcbg); }
  .task.today::before { content: ""; position: absolute; left: 0; top: 1px; bottom: 1px; width: 3px; background: var(--pc); }
  .task .check { width: 46px; height: 50px; display: grid; place-items: center; flex: none; }
  .task .check i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--sub); display: block; }
  .task.today .check i { border-color: var(--pc); }
  .task.stay .check i { border-color: var(--line); }
  .task .check:active i { background: var(--pc); border-color: var(--pc); }
  .task .text { flex: 1; min-width: 0; text-align: left; padding: 14px 6px 14px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task.stay .text { color: var(--stay); }
  .task input.text { padding: 8px 6px; background: var(--hover); border-radius: 4px; }
  .pill {
    flex: none; height: 26px; padding: 0 10px; margin-right: 6px; border-radius: 13px; font-size: 12px;
    border: 1px solid var(--line); color: var(--sub);
  }
  .pill:last-child { margin-right: 4px; }
  .pill { padding: 0 8px; margin-right: 4px; }
  .pill.on.p-routine { background: var(--accent-dim); border-color: var(--accent-dim); color: var(--accent); }
  .check i { position: relative; }
  .done .check i { background: var(--accent); border-color: var(--accent); }
  .task.done .check i { background: var(--pc); border-color: var(--pc); }
  .done .check i::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #111318; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .done .text, .done .rtext { color: var(--stay); text-decoration: line-through; }

  /* 今日のタスク枠 */
  .rmark { color: var(--accent); margin-right: 6px; }
  .routines { margin: 18px 14px 0; }
  .rhead { display: flex; justify-content: space-between; color: var(--accent); font-size: 12px; padding: 0 2px 8px; border-bottom: 1px solid var(--line); }
  .rhead .rcount { color: var(--sub); }
  .rrow { display: flex; align-items: center; min-height: 46px; border-bottom: 1px solid var(--line); }
  .rrow .check { width: 40px; height: 46px; display: grid; place-items: center; flex: none; }
  .rrow .check i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--sub); display: block; }
  .rtext { flex: 1; min-width: 0; text-align: left; padding: 12px 6px 12px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rproj { flex: none; max-width: 40%; display: flex; align-items: center; gap: 6px; color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 2px; }
  .rproj b { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pill.on.p-today { background: var(--pc); border-color: var(--pc); color: #fff; }
  .pill.on.p-stay { background: var(--line); border-color: var(--line); }


  .card, .task { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .card.dragging, .task.dragging { position: relative; z-index: 3; transform: scale(1.02); box-shadow: 0 8px 22px rgba(0,0,0,.6); }
  .card.dragging { outline: 2px solid rgba(255,255,255,.7); }
  .task.dragging { background: var(--hover); outline: 1px solid var(--pc); border-radius: 6px; }

  /* 入力欄 */
  footer { flex: none; padding: 8px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: var(--bg); }
  .entry { display: flex; align-items: center; height: 46px; background: var(--input); border: 1px solid var(--accent-dim); }
  .entry:focus-within { border-color: var(--accent); }
  .entry button { width: 44px; height: 44px; color: var(--accent); font-size: 22px; font-weight: 600; flex: none; }
  .entry input { padding-right: 12px; }

  /* 下から出るメニュー */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-end; z-index: 10; }
  .sheet-bg.show { display: flex; }
  .sheet { width: 100%; background: var(--header); padding: 12px 12px max(16px, env(safe-area-inset-bottom)); border-radius: 14px 14px 0 0; }
  .sheet .title { color: var(--sub); font-size: 12px; padding: 4px 6px 10px; }
  .sheet .rename { display: flex; gap: 8px; margin-bottom: 8px; }
  .sheet .rename input { background: var(--input); border: 1px solid var(--line); padding: 10px 12px; }
  .sheet .rename button { background: var(--accent-dim); padding: 0 16px; white-space: nowrap; }
  .sheet .item { display: block; width: 100%; text-align: left; padding: 14px 8px; border-top: 1px solid var(--line); }
  .sheet .item.danger { color: var(--danger); }
  .sheet .colors { display: flex; gap: 10px; padding: 12px 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .sheet .colors button { width: 30px; height: 30px; border-radius: 50%; }
  .sheet .colors button.sel { outline: 2px solid #fff; outline-offset: 2px; }

  .toast {
    position: fixed; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom)); background: #2a2f3a;
    padding: 12px 14px; display: none; align-items: center; justify-content: space-between; border-radius: 8px; z-index: 5;
  }
  .toast.show { display: flex; }
  .toast button { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>NEXT PROJECT</h1>
  <span class="count" id="count">0</span>
</header>
<main id="main"></main>
<footer>
  <div class="entry">
    <button id="add" aria-label="追加">+</button>
    <input id="entry" enterkeyhint="done" autocomplete="off" placeholder="プロジェクトを入力して Enter">
  </div>
</footer>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span>完了しました</span><button id="undo">元に戻す</button></div>

<script>
// データの保存先（Google Apps Script）。合言葉がないと読み書きできない。
const API = 'https://script.google.com/macros/s/AKfycbwHMumomViRFbOoEB_PJfgHMIyQ5s4qVzgDuJfqW3c23ZMKqL4DsVmbn1F5NePtojV90g/exec';
let KEY = '';
try {
  const m = location.hash.match(/k=([^&]+)/);
  if (m) { localStorage.setItem('np-key', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
  KEY = localStorage.getItem('np-key') || '';
} catch (e) {}
const PALETTE = ['#118c80', '#4f46e5', '#db2777', '#ea580c', '#7c3aed', '#0284c7', '#65a30d', '#ca8a04'];

let doc = { goal: '', habit: '', projects: [] };
let rev = -1, cur = -1;
let saveTimer = null, saving = false, dirty = false;
let lastDone = null, toastTimer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const isToday = (t) => t.today === today();
// ルーティンを今日やったか（日付が変わると外れる）
const isDone = (t) => t.routine && t.done === today();
const color = (p) => PALETTE[(p.color || 0) % PALETTE.length];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

function normalize(projects) {
  return (projects || []).map((p) => ({
    name: String(p.name || ''), color: Number(p.color) || 0, stay: !!p.stay,
    tasks: (p.tasks || []).map((t) => typeof t === 'string'
      ? { text: t, today: '', stay: false, routine: false, done: '' }
      : { text: String(t.text || ''), today: String(t.today || ''), stay: !!t.stay, routine: !!t.routine, done: String(t.done || '') })
  }));
}

// ---------- 描画 ----------
function render() {
  $('count').textContent = doc.projects.length;
  const m = $('main');
  if (cur < 0 || cur >= doc.projects.length) {
    cur = -1;
    $('entry').placeholder = 'プロジェクトを入力して Enter';
    m.innerHTML = `
      <div class="goal"><label for="goal">達成すべき目標</label>
        <input id="goal" placeholder="タップして目標を入力" value="${esc(doc.goal)}" enterkeyhint="done"></div>
      <div class="goal habit"><label for="habit">捨てるべき思考のクセ</label>
        <input id="habit" placeholder="タップして入力" value="${esc(doc.habit)}" enterkeyhint="done"></div>
      <div class="projects">${doc.projects.length ? doc.projects.map((p, i) => `
        <div class="card ${p.stay ? 'stay' : ''}" data-i="${i}" style="--pc:${color(p)}">
          <button class="name" data-open="${i}">${esc(p.name)}</button>${p.stay ? '<span class="cstay">ステイ</span>' : ''}
          <button class="more" data-menu="${i}" aria-label="メニュー">⋯</button>
        </div>`).join('') : '<div class="empty">下の欄からプロジェクトを追加</div>'}
      </div>${routineHtml()}`;
  } else {
    const p = doc.projects[cur];
    const pc = color(p);
    const n = p.tasks.filter(isToday).length;
    $('entry').placeholder = 'タスクを入力して Enter';
    m.innerHTML = `
      <div style="--pc:${pc};--pcbg:${rgba(pc, .22)}">
        <div class="bar">
          <button class="back" data-back aria-label="戻る">‹</button>
          <span class="pdot"></span>
          <span class="pname">${esc(p.name)}</span>
          <span class="tcount">${n ? `今日 ${n} / ${p.tasks.length}` : `${p.tasks.length} tasks`}</span>
          <button class="more" data-menu="${cur}" aria-label="メニュー">⋯</button>
        </div>
        <div class="tasks">${p.tasks.map((t, i) => `
          <div class="task ${isToday(t) ? 'today' : ''} ${t.stay ? 'stay' : ''} ${isDone(t) ? 'done' : ''}">
            <button class="check" data-done="${i}" aria-label="完了"><i></i></button>
            <button class="text" data-edit="${i}">${esc(t.text)}</button>
            <button class="pill p-routine ${t.routine ? 'on' : ''}" data-routine="${i}">ルーティン</button>
            <button class="pill p-today ${isToday(t) ? 'on' : ''}" data-today="${i}">今日</button>
            <button class="pill p-stay ${t.stay ? 'on' : ''}" data-stay="${i}">ステイ</button>
          </div>`).join('')}</div>
      </div>`;
  }
}

function routineHtml() {
  const items = [];
  // 今日のタスク = ルーティン ＋「今日」を付けたタスク（ステイ中は除く）
  doc.projects.forEach((p, pi) => p.tasks.forEach((t, ti) => { if (!t.stay && (t.routine || isToday(t))) items.push({ p, pi, t, ti }); }));
  if (!items.length) return '';
  const left = items.filter((x) => !isDone(x.t)).length;
  return `
      <div class="routines">
        <div class="rhead"><span>今日のタスク</span><span class="rcount">${left ? `残り ${left}` : '完了'}</span></div>
        ${items.map((x) => `
          <div class="rrow ${isDone(x.t) ? 'done' : ''}">
            <button class="check" data-rdone="${x.pi}:${x.ti}" aria-label="完了"><i></i></button>
            <button class="rtext" data-ropen="${x.pi}">${x.t.routine ? '<span class="rmark">↻</span>' : ''}${esc(x.t.text)}</button>
            <span class="rproj"><b style="background:${color(x.p)}"></b>${esc(x.p.name)}</span>
          </div>`).join('')}
      </div>`;
}

// ---------- 操作 ----------
$('main').addEventListener('click', (e) => {
  if (suppressClick) { e.preventDefault(); return; }
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.open !== undefined) { cur = +d.open; render(); $('main').scrollTop = 0; return; }
  if (d.back !== undefined) { cur = -1; render(); return; }
  if (d.menu !== undefined) { openMenu(+d.menu); return; }
  if (d.ropen !== undefined) { cur = +d.ropen; render(); $('main').scrollTop = 0; return; }
  if (d.rdone !== undefined) {
    const [pi, ti] = d.rdone.split(':').map(Number);
    const t = doc.projects[pi] && doc.projects[pi].tasks[ti];
    if (!t) return;
    if (t.routine) { t.done = isDone(t) ? '' : today(); save(); render(); return; }   // ルーティン → 今日やった
    lastDone = { project: pi, index: ti, task: t };                                    // 今日のタスク → 完了（消す）
    doc.projects[pi].tasks.splice(ti, 1);
    showToast(); save(); render();
    return;
  }
  const p = doc.projects[cur];
  if (d.done !== undefined) {
    const i = +d.done;
    // ルーティンは消さずに「今日やった」を付け外し
    if (p.tasks[i].routine) { p.tasks[i].done = isDone(p.tasks[i]) ? '' : today(); save(); render(); return; }
    lastDone = { project: cur, index: i, task: p.tasks[i] };
    p.tasks.splice(i, 1);
    showToast(); save(); render(); return;
  }
  if (d.routine !== undefined) {
    const t = p.tasks[+d.routine];
    t.routine = !t.routine; if (!t.routine) t.done = '';
    save(); render(); return;
  }
  if (d.today !== undefined) {
    const t = p.tasks[+d.today];
    if (isToday(t)) t.today = ''; else { t.today = today(); t.stay = false; }
    save(); render(); return;
  }
  if (d.stay !== undefined) {
    const t = p.tasks[+d.stay];
    t.stay = !t.stay; if (t.stay) t.today = '';
    save(); render(); return;
  }
  if (d.edit !== undefined) { startEdit(b, +d.edit); }
});

function startEdit(btn, i) {
  const p = doc.projects[cur];
  const input = document.createElement('input');
  input.className = 'text'; input.value = p.tasks[i].text; input.enterKeyHint = 'done';
  btn.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = (commit) => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (commit && v && p.tasks[i]) { p.tasks[i].text = v; save(); }
    render();
  };
  input.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}

$('main').addEventListener('change', (e) => {
  if (e.target.id === 'goal') { doc.goal = e.target.value.trim(); save(); }
  if (e.target.id === 'habit') { doc.habit = e.target.value.trim(); save(); }
});
$('main').addEventListener('keydown', (e) => {
  if ((e.target.id === 'goal' || e.target.id === 'habit') && e.key === 'Enter' && !e.isComposing) e.target.blur();
});

function addEntry() {
  const v = $('entry').value.trim();
  if (!v) return;
  $('entry').value = '';
  if (cur < 0) doc.projects.push({ name: v, color: doc.projects.length % PALETTE.length, stay: false, tasks: [] });
  else doc.projects[cur].tasks.push({ text: v, today: '', stay: false, routine: false, done: '' });
  save(); render();
  $('main').scrollTop = $('main').scrollHeight;
}
$('entry').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addEntry(); } });
$('add').addEventListener('click', () => { if ($('entry').value.trim()) addEntry(); else $('entry').focus(); });

// 完了の取り消し
function showToast() {
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
}
$('undo').addEventListener('click', () => {
  if (lastDone && doc.projects[lastDone.project]) {
    doc.projects[lastDone.project].tasks.splice(lastDone.index, 0, lastDone.task);
    lastDone = null; save(); render();
  }
  $('toast').classList.remove('show');
});

// プロジェクトのメニュー（名前・色・削除）
function openMenu(i) {
  const p = doc.projects[i];
  $('sheet').innerHTML = `
    <div class="title">${esc(p.name)}</div>
    <div class="rename"><input id="rn" value="${esc(p.name)}" enterkeyhint="done"><button id="rnOk">名前を保存</button></div>
    <div class="colors">${PALETTE.map((c, ci) => `<button data-color="${ci}" class="${ci === p.color % PALETTE.length ? 'sel' : ''}" style="background:${c}" aria-label="色${ci + 1}"></button>`).join('')}</div>
    <button class="item" id="stay">${p.stay ? 'ステイを解除' : 'ステイにする'}</button>
    <button class="item danger" id="del">削除</button>
    <button class="item" id="cancel">閉じる</button>`;
  $('sheetBg').classList.add('show');
  const rename = () => { const v = $('rn').value.trim(); if (v) { p.name = v; save(); } closeMenu(); };
  $('rnOk').onclick = rename;
  $('rn').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) rename(); };
  $('sheet').querySelectorAll('[data-color]').forEach((b) => b.onclick = () => { p.color = +b.dataset.color; save(); closeMenu(); });
  let armed = false;
  $('del').onclick = () => {
    if (!armed) { armed = true; $('del').textContent = 'タスクごと削除します。もう一度タップで削除'; return; }
    doc.projects.splice(i, 1);
    if (cur === i) cur = -1; else if (cur > i) cur--;
    save(); closeMenu();
  };
  $('stay').onclick = () => { p.stay = !p.stay; save(); closeMenu(); };
  $('cancel').onclick = closeMenu;
}
function closeMenu() { $('sheetBg').classList.remove('show'); render(); }
$('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeMenu(); });

// ---------- 並べ替え（長押しで持ち上げて、指を動かす） ----------
let drag = null, pressTimer = null, pressCleanup = null, suppressClick = false;
$('main').addEventListener('pointerdown', (e) => {
  const item = e.target.closest('.card, .task');
  if (!item || e.button > 0 || drag) return;
  // 丸・今日・ステイ・⋯ からは始めない（名前と文字の部分だけ）
  const b = e.target.closest('button');
  if (b && !b.classList.contains('name') && !b.classList.contains('text')) return;
  const sx = e.clientX, sy = e.clientY;
  const onMove = (ev) => { if (Math.abs(ev.clientX - sx) > 8 || Math.abs(ev.clientY - sy) > 8) cleanup(); };
  const cleanup = () => {
    clearTimeout(pressTimer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', cleanup);
    window.removeEventListener('pointercancel', cleanup);
  };
  pressCleanup = cleanup;
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', cleanup);
  window.addEventListener('pointercancel', cleanup);
  pressTimer = setTimeout(() => { cleanup(); startDrag(item, sy); }, 350);
});
// ドラッグ中は画面のスクロールを止める
document.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', (e) => { if (drag || e.target.closest('.card, .task')) e.preventDefault(); });

function startDrag(item, y) {
  const sel = item.classList.contains('card') ? '.card' : '.task';
  const list = item.parentElement;
  drag = { item, list, sel, from: [...list.querySelectorAll(sel)].indexOf(item) };
  item.classList.add('dragging');
  if (navigator.vibrate) navigator.vibrate(15);
  window.addEventListener('pointermove', onDragMove, { passive: false });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
}
function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  const y = e.clientY;
  // 指の位置より下にある最初の行の前に入れる（ほかの行がよける）
  const others = [...drag.list.querySelectorAll(drag.sel)].filter((el) => el !== drag.item);
  const next = others.find((el) => { const r = el.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (next) { if (drag.item.nextElementSibling !== next) drag.list.insertBefore(drag.item, next); }
  else if (others.length && drag.item !== others[others.length - 1].nextElementSibling) others[others.length - 1].after(drag.item);
  // 端に来たら自動でスクロール
  const m = $('main').getBoundingClientRect();
  if (y < m.top + 40) $('main').scrollTop -= 10;
  else if (y > m.bottom - 40) $('main').scrollTop += 10;
}
function endDrag() {
  if (!drag) return;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', endDrag);
  const { item, list, sel, from } = drag;
  const to = [...list.querySelectorAll(sel)].indexOf(item);
  drag = null;
  item.classList.remove('dragging');
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
  if (to >= 0 && to !== from) {
    const arr = sel === '.card' ? doc.projects : doc.projects[cur].tasks;
    const [moved] = arr.splice(from, 1);
    arr.splice(to, 0, moved);
    save();
  }
  render();
}

function setStatus(s) { $('dot').className = 'dot' + (s === 'busy' ? ' busy' : s === 'err' ? ' err' : ''); }
function isEditing() {
  const a = document.activeElement;
  return a && a.tagName === 'INPUT' && a.id !== 'entry';
}
function cache() { try { localStorage.setItem('np-cache', JSON.stringify({ doc, rev })); } catch (e) {} }

async function api(body) {
  const res = body
    ? await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ k: KEY }, body)) })
    : await fetch(API + '?api=get&k=' + encodeURIComponent(KEY), { cache: 'no-store' });
  const text = await res.text();
  let d;
  try { d = JSON.parse(text); } catch (e) { throw new Error('auth'); }   // 合言葉が違うと HTML が返る
  if (d.error) throw new Error(d.error);
  return d;
}

function save() {
  dirty = true; cache();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (saving) return;
  saving = true; dirty = false; setStatus('busy');
  try {
    const r = await api({ goal: doc.goal, habit: doc.habit, projects: doc.projects });
    rev = r.rev; cache(); setStatus('');
  } catch (e) {
    dirty = true; setStatus('err');
    setTimeout(flush, 5000);
  }
  saving = false;
  if (dirty) flush();
}
async function pull() {
  if (saving || dirty || !KEY) return;
  try {
    const d = await api();
    setStatus('');
    if (saving || dirty || isEditing() || $('sheetBg').classList.contains('show')) return;
    if (d.rev !== rev) {
      // サーバーがまだ habit を知らない（古い Code.gs）ときは、こちらの内容を残す
      doc = { goal: d.goal || '', habit: ('habit' in d) ? (d.habit || '') : doc.habit, projects: normalize(d.projects) };
      rev = d.rev; cache(); render();
    }
  } catch (e) {
    setStatus('err');
    if (e.message === 'auth') askKey('合言葉が違うようです');
  }
}

// 合言葉がまだ無いときの画面
function askKey(msg) {
  document.querySelector('footer').style.display = 'none';
  $('main').innerHTML = `
    <div class="goal" style="margin-top:40px"><label for="k">合言葉</label>
      <input id="k" placeholder="合言葉を入力" autocomplete="off" enterkeyhint="done"></div>
    <div class="empty" style="padding-top:12px">${esc(msg || 'PC で受け取った合言葉を入力してください')}</div>`;
  $('k').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    KEY = $('k').value.trim();
    try { localStorage.setItem('np-key', KEY); } catch (err) {}
    document.querySelector('footer').style.display = '';
    render(); pull();
  });
}

try {
  const c = JSON.parse(localStorage.getItem('np-cache') || 'null');
  if (c && c.doc) { doc = { goal: c.doc.goal || '', habit: c.doc.habit || '', projects: normalize(c.doc.projects) }; rev = c.rev; }
} catch (e) {}
if (KEY) { render(); pull(); } else askKey();
setInterval(pull, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
